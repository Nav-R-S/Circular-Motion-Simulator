<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div id="registerContainer">
        <div id="registerHeader">
            <input type="image" src="images/turn-back.png" id="backButton" class="tool toolImgButton">
            <input type="image" src="images/homeColoured.png" id="homeButton" class="tool toolImgButton">
        </div>
        <div id="registerContainer">
            <div id="registerContent">
                <div id="registerHeading">Register</div>
                <form id="registerForm">
                    <input type="text" id="registerUsername" placeholder="Username" class="registerInput">
                    <input type="password" id="registerPassword" placeholder="Password" class="registerInput">
                    <input type="password" id="registerConfirmPassword" placeholder="Confirm Password" class="registerInput"> 
                    <input type="submit" value="Register" id="registerButton" class="registerInput">
                </form>
                
            </div>
        </div>
        
    </div>
    <script src="register.js"></script>
</body>
</html>
