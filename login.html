<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
    <div id="loginContainer">
        <div id="loginHeader">
            <div id="loginTitle">Sign In</div>
            <div id="loginHeaderRight">
                <input type="image" src="images/homeColoured.png" id="homeButton" class="tool toolImgButton">
            </div>
        </div>
        <div id="loginContentContainer">
            <div id="loginContent">
                <form id="loginForm">
                    <input type="text" id="registerUsername" placeholder="Username" class="loginInput">
                    <input type="password" id="registerPassword" placeholder="Password" class="loginInput">
                    <input type="submit" value="Sign In" id="registerButton" class="loginInput loginSubmitButton">
                </form>
                <a href="register.html" id="registerLink">Don't have an account? Register here</a>
            </div>
        </div>
        
    </div>
    <script src="login.js"></script>
</body>
</html>
